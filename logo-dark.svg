<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="acreGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3d7a37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a9c53;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background for dark mode usage -->
  <rect x="0" y="0" width="400" height="120" fill="#1a1a1a"/>

  <!-- Background rectangle for ACRE -->
  <rect x="10" y="15" width="220" height="70" rx="4" fill="url(#acreGradientDark)"/>

  <!-- ACRE text - big white block letters -->
  <text x="120" y="68" font-family="Arial Black, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">ACRE</text>

  <!-- PROFIT text - P much bigger in Impact font, ROFIT in white for dark background -->
  <text x="295" y="68" font-family="Arial Black, Helvetica, sans-serif" font-size="52" font-weight="900" text-anchor="middle" letter-spacing="1"><tspan fill="#666666" font-size="72" font-family="Impact, Arial Black, sans-serif" font-weight="900">P</tspan><tspan fill="#FFFFFF">ROFIT</tspan></text>

  <!-- Tagline / domain -->
  <text x="200" y="105" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#999999" text-anchor="middle" letter-spacing="3">ACREPROFIT.COM</text>
</svg>
