# Render Blueprint for Acre Profit
# Deploy at: https://dashboard.render.com/blueprints

services:
  # API Server
  - type: web
    name: acreprofit-api
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://acreprofit.com
      # Email configuration
      # Primary: Resend HTTP API (preferred - bypasses M365 Security Defaults).
      # Set RESEND_API_KEY and createEmailTransporter() will use Resend.
      # EMAIL_FROM must be on a Resend-verified domain (e.g. noreply@acreprofit.com).
      - key: RESEND_API_KEY
        sync: false
      # Fallback: SMTP (used only if RESEND_API_KEY is unset).
      - key: SMTP_HOST
        value: smtp.office365.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

  # Static Site (optional - if not using GitHub Pages)
