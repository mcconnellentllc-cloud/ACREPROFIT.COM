# Render Blueprint for Acre Profit
# Deploy at: https://dashboard.render.com/blueprints

services:
  # API Server
  - type: web
    name: acreprofit-api
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://acreprofit.com
      # Email configuration
      # Primary: SendGrid API (preferred - bypasses M365 Security Defaults).
      # Set SENDGRID_API_KEY and createEmailTransporter() will use SendGrid.
      # EMAIL_FROM must be on a SendGrid domain-authenticated sender
      # (acreprofit.com is already set up via s1/s2._domainkey CNAMEs).
      - key: SENDGRID_API_KEY
        sync: false
      # PEM public key from SendGrid Mail Settings > Signed Event Webhook.
      # Required for /api/webhooks/sendgrid to verify delivered/bounce events.
      # Paste the full `-----BEGIN PUBLIC KEY-----...-----END PUBLIC KEY-----`
      # block; literal \n escapes are also accepted.
      - key: SENDGRID_WEBHOOK_PUBLIC_KEY
        sync: false
      # Test mode: when EMAIL_TEST_MODE=true, all outbound mail is redirected
      # to EMAIL_TEST_RECIPIENT regardless of the actual recipient. Send throws
      # if test mode is on but recipient is unset (no silent accidental delivery).
      - key: EMAIL_TEST_MODE
        value: "false"
      - key: EMAIL_TEST_RECIPIENT
        sync: false
      # Fallback: SMTP (used only if SENDGRID_API_KEY is unset).
      - key: SMTP_HOST
        value: smtp.office365.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Stripe (Pay Now on invoices + existing ACH/card order payment flow).
      # STRIPE_MODE gates live vs test behaviour and is echoed in logs; the
      # actual keys below determine which Stripe account we hit. Flip to
      # "live" only after the first successful test-mode end-to-end.
      - key: STRIPE_MODE
        value: test
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      # Webhook signing secret from Stripe Dashboard > Developers > Webhooks
      # for the endpoint at {FRONTEND_URL}/api/webhooks/stripe.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # Static Site — serves the frontend (acreprofit.com). Moved off GitHub
  # Pages 2026-10-20 because Pages doesn't serve private repos on the free
  # GitHub plan. Render static sites are free (100GB bandwidth/mo) and
  # repo-visibility independent, as long as Render's GitHub App has access
  # to the repo.
  #
  # Parity note: same behavior as GitHub Pages (publishes everything at the
  # repo root, including server/). Nothing in-repo is secret (all secrets
  # live in Render env vars), but if you ever want to lock down server/
  # at the CDN layer, add a build step that stages only frontend files.
  - type: web
    name: acreprofit-web
    env: static
    pullRequestPreviewsEnabled: false
    buildCommand: echo "no build needed"
    staticPublishPath: ./
    headers:
      # HTML files should re-check with the server on each request so a
      # deploy actually goes live immediately instead of being pinned by
      # the CDN. CSS/JS/SVG/image assets are safe to cache long because
      # frontend code is deployed together with any content changes.
      - path: /*.html
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /*.css
        name: Cache-Control
        value: public, max-age=3600
      - path: /*.js
        name: Cache-Control
        value: public, max-age=3600
      - path: /*.svg
        name: Cache-Control
        value: public, max-age=86400
      - path: /*.png
        name: Cache-Control
        value: public, max-age=86400
