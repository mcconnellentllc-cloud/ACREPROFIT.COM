<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5a27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a7c43;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Square background -->
  <rect x="5" y="5" width="90" height="90" rx="8" fill="url(#iconGradient)"/>

  <!-- AP monogram -->
  <text x="50" y="68" font-family="Arial Black, Helvetica, sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">AP</text>
</svg>
