<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your AcreProfit password">
    <title>Reset Password - AcreProfit</title>

    <meta name="theme-color" content="#16a34a">
    <link rel="icon" type="image/svg+xml" href="logo-icon.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
                <h1>AcreProfit</h1>
            </div>

            <div class="auth-title">
                <h2>Reset Password</h2>
                <p>Enter your new password below</p>
            </div>

            <div id="alert-container"></div>

            <form id="reset-form">
                <div class="form-group">
                    <label class="form-label required" for="password">New Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="Min. 8 characters"
                        required
                        autocomplete="new-password"
                        minlength="8"
                    >
                    <p class="form-hint">Must be at least 8 characters</p>
                </div>

                <div class="form-group">
                    <label class="form-label required" for="confirm-password">Confirm New Password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        class="form-input"
                        placeholder="Confirm your new password"
                        required
                        autocomplete="new-password"
                        minlength="8"
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">
                    <span class="btn-text">Reset Password</span>
                    <span class="btn-loading hidden">
                        <span class="spinner spinner-sm"></span>
                    </span>
                </button>
            </form>

            <div class="auth-footer">
                <a href="login.html">Back to Sign In</a>
            </div>
        </div>
    </div>

    <script>
        // API Configuration
        const API_URL = window.location.hostname === 'localhost'
            ? 'http://localhost:3001/api'
            : '/api';

        // DOM Elements
        const form = document.getElementById('reset-form');
        const submitBtn = document.getElementById('submit-btn');
        const alertContainer = document.getElementById('alert-container');

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // Check for valid token
        if (!token) {
            showAlert('Invalid or missing reset token. Please request a new password reset.', 'error');
            document.getElementById('reset-form').style.display = 'none';
        }

        // Show alert message
        function showAlert(message, type = 'error') {
            alertContainer.innerHTML = `
                <div class="alert alert-${type}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        ${type === 'error'
                            ? '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'
                            : '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>'}
                    </svg>
                    <span>${message}</span>
                </div>
            `;
        }

        // Set loading state
        function setLoading(loading) {
            submitBtn.disabled = loading;
            submitBtn.querySelector('.btn-text').classList.toggle('hidden', loading);
            submitBtn.querySelector('.btn-loading').classList.toggle('hidden', !loading);
        }

        // Handle form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // Validation
            if (!password) {
                showAlert('Please enter a new password');
                return;
            }

            if (password.length < 8) {
                showAlert('Password must be at least 8 characters');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('Passwords do not match');
                return;
            }

            setLoading(true);
            alertContainer.innerHTML = '';

            try {
                const response = await fetch(`${API_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('Password reset successfully! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showAlert(data.message || 'Error resetting password. The link may have expired.');
                }
            } catch (error) {
                console.error('Reset password error:', error);
                showAlert('Unable to connect to server. Please try again.');
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
