<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcreProfit — Live Retail Prices</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --accent: #2d5a27;
            --accent-dark: #1f4019;
            --fg: #111;
            --fg-mute: #555;
            --border: #d0d0d0;
            --bg: #fafafa;
            --card-bg: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            font-size: 15px;
            color: var(--fg);
            background: var(--bg);
            padding: 24px 16px;
            line-height: 1.5;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .page-header {
            text-align: center;
            padding: 12px 0 20px;
            border-bottom: 2px solid var(--accent);
        }
        .page-header h1 {
            font-size: 24px;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .page-header .subtitle { font-size: 14px; color: var(--fg-mute); }
        .page-header .meta { font-size: 12px; color: var(--fg-mute); margin-top: 6px; }
        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            margin: 16px 0;
        }
        .btn {
            padding: 10px 16px;
            border: 1.5px solid var(--accent);
            border-radius: 6px;
            background: var(--accent);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
        .btn:hover { background: var(--accent-dark); }
        .btn-outline {
            background: white;
            color: var(--accent);
        }
        .btn-outline:hover { background: #f0f5f0; }
        .copy-status { font-size: 13px; color: var(--fg-mute); margin-left: auto; }
        .copy-status.ok { color: var(--accent); font-weight: 600; }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 16px;
        }
        .card h2 {
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-bottom: 8px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border);
            color: var(--accent);
        }
        table { width: 100%; border-collapse: collapse; }
        th, td {
            padding: 6px 8px;
            text-align: left;
            font-size: 13px;
            border-bottom: 1px solid #efefef;
        }
        th {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--fg-mute);
            border-bottom: 2px solid var(--border);
        }
        td.price, th.price {
            text-align: right;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        td.price { font-weight: 600; }
        pre.copyblock {
            white-space: pre;
            overflow-x: auto;
            background: #f4f4f4;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            font-family: "SF Mono", Consolas, "Courier New", monospace;
            font-size: 12px;
            line-height: 1.4;
            max-height: 460px;
            overflow-y: auto;
        }
        .loading, .error {
            text-align: center;
            padding: 40px 20px;
            color: var(--fg-mute);
        }
        .error { color: #b00020; }
        .footer-note {
            margin-top: 16px;
            padding: 12px;
            background: #eef5ec;
            border-left: 3px solid var(--accent);
            border-radius: 4px;
            font-size: 13px;
            color: var(--fg-mute);
        }
        .footer-note strong { color: var(--fg); }
        @media print {
            body { background: white; padding: 0.3in; }
            .actions, .no-print { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>ACRE PROFIT</h1>
            <div class="subtitle">Retail Price List &mdash; NE Colorado</div>
            <div class="meta" id="generatedMeta">Loading&hellip;</div>
        </div>

        <div class="actions no-print">
            <button class="btn" id="copyBtn" onclick="copyToClipboard()">Copy to Clipboard</button>
            <button class="btn btn-outline" onclick="downloadTxt()">Download .txt</button>
            <button class="btn btn-outline" onclick="window.print()">Print / Save PDF</button>
            <button class="btn btn-outline" onclick="toggleView()" id="viewToggleBtn">Switch to plain text view</button>
            <span class="copy-status" id="copyStatus"></span>
        </div>

        <div id="richView">
            <div class="loading" id="loadingMsg">Loading live prices&hellip;</div>
        </div>

        <div id="plainView" style="display: none;">
            <pre class="copyblock" id="plainText">Loading…</pre>
        </div>

        <div class="footer-note">
            <strong>AcreProfit LLC</strong> &middot; 970-571-1015 &middot; kyle@acreprofit.com<br>
            Prices subject to change without notice. Volume discounts available on shuttle+ quantities. Call for quote on unlisted products.
        </div>
    </div>

    <script>
        // Point at the API server. Same convention as admin.html.
        const API_URL = window.location.hostname === 'localhost'
            ? 'http://localhost:3000'
            : 'https://acreprofit-com.onrender.com';

        const CATEGORY_ORDER = ['herbicide', 'fungicide', 'insecticide', 'adjuvant', 'fertilizer', 'other'];
        const CATEGORY_LABEL = {
            herbicide: 'Herbicides',
            fungicide: 'Fungicides',
            insecticide: 'Insecticides',
            adjuvant: 'Adjuvants & Surfactants',
            fertilizer: 'Fertilizers',
            other: 'Other'
        };

        let _products = [];
        let _generatedAt = null;

        function esc(s) {
            return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function money(n) {
            return '$' + (Number(n) || 0).toFixed(2);
        }

        function groupByCategory(products) {
            const groups = {};
            products.forEach(p => {
                const cat = CATEGORY_LABEL[p.category] ? p.category : 'other';
                if (!groups[cat]) groups[cat] = [];
                groups[cat].push(p);
            });
            return groups;
        }

        function renderRich(products) {
            const groups = groupByCategory(products);
            let html = '';
            CATEGORY_ORDER.forEach(cat => {
                const list = groups[cat];
                if (!list || list.length === 0) return;
                list.sort((a, b) => (a.productName || '').localeCompare(b.productName || ''));
                html += `<div class="card">
                    <h2>${esc(CATEGORY_LABEL[cat])}</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Pack Size</th>
                                <th class="price">Price</th>
                            </tr>
                        </thead>
                        <tbody>`;
                list.forEach(p => {
                    const unit = p.unit ? '/' + esc(p.unit) : '';
                    html += `<tr>
                        <td>${esc(p.productName)}</td>
                        <td>${esc(p.packSize || '')}</td>
                        <td class="price">${money(p.sellPrice)}${unit}</td>
                    </tr>`;
                });
                html += '</tbody></table></div>';
            });
            if (!html) {
                html = '<div class="error">No priced products available yet.</div>';
            }
            document.getElementById('richView').innerHTML = html;
        }

        function buildPlainText(products, generatedAt) {
            const groups = groupByCategory(products);
            const dateStr = generatedAt
                ? new Date(generatedAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
                : new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

            const nameW = Math.max(28, Math.min(42, Math.max(0, ...products.map(p => (p.productName || '').length)) + 2));
            const packW = Math.max(14, Math.min(22, Math.max(0, ...products.map(p => (p.packSize || '').length)) + 2));

            const pad = (s, n) => {
                s = String(s || '');
                return s.length >= n ? s.slice(0, n - 1) + ' ' : s + ' '.repeat(n - s.length);
            };
            const padLeft = (s, n) => {
                s = String(s || '');
                return s.length >= n ? s : ' '.repeat(n - s.length) + s;
            };

            let text = 'ACRE PROFIT — Retail Price List\n';
            text += 'NE Colorado · Prices subject to change\n';
            text += 'Generated: ' + dateStr + '\n\n';

            CATEGORY_ORDER.forEach(cat => {
                const list = groups[cat];
                if (!list || list.length === 0) return;
                list.sort((a, b) => (a.productName || '').localeCompare(b.productName || ''));
                text += CATEGORY_LABEL[cat].toUpperCase() + '\n';
                list.forEach(p => {
                    const unit = p.unit ? '/' + p.unit : '';
                    const price = money(p.sellPrice) + unit;
                    text += '  ' + pad(p.productName || '', nameW) + pad(p.packSize || '', packW) + padLeft(price, 14) + '\n';
                });
                text += '\n';
            });

            text += 'Volume discounts available on shuttle+ quantities.\n';
            text += 'Call for quote on unlisted products.\n';
            text += 'AcreProfit LLC · 970-571-1015 · kyle@acreprofit.com\n';
            return text;
        }

        async function loadPrices() {
            try {
                const res = await fetch(API_URL + '/api/public/retail-prices');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                _products = data.products || [];
                _generatedAt = data.generatedAt;

                const metaDate = _generatedAt
                    ? new Date(_generatedAt).toLocaleString()
                    : new Date().toLocaleString();
                document.getElementById('generatedMeta').textContent =
                    'Live — ' + _products.length + ' products · updated ' + metaDate;

                renderRich(_products);
                document.getElementById('plainText').textContent = buildPlainText(_products, _generatedAt);
            } catch (err) {
                document.getElementById('richView').innerHTML =
                    '<div class="error">Could not load prices: ' + esc(err.message) +
                    '<br><br>If the API server is sleeping on the free Render tier, give it ~30 seconds and refresh.</div>';
                document.getElementById('plainText').textContent =
                    'Could not load prices: ' + err.message;
            }
        }

        async function copyToClipboard() {
            const text = document.getElementById('plainText').textContent;
            const btn = document.getElementById('copyBtn');
            const status = document.getElementById('copyStatus');
            try {
                await navigator.clipboard.writeText(text);
                status.textContent = '✓ Copied — paste wherever';
                status.classList.add('ok');
                btn.textContent = '✓ Copied';
            } catch (_) {
                // Fallback: select the <pre> block so the user can Ctrl+C.
                document.getElementById('plainView').style.display = 'block';
                document.getElementById('richView').style.display = 'none';
                document.getElementById('viewToggleBtn').textContent = 'Switch to card view';
                const range = document.createRange();
                range.selectNodeContents(document.getElementById('plainText'));
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
                status.textContent = 'Press Ctrl+C to copy — text is selected';
                status.classList.add('ok');
            }
            setTimeout(() => {
                btn.textContent = 'Copy to Clipboard';
                status.textContent = '';
                status.classList.remove('ok');
            }, 4000);
        }

        function downloadTxt() {
            const text = document.getElementById('plainText').textContent;
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const dateStamp = new Date().toISOString().slice(0, 10);
            a.href = url;
            a.download = 'acreprofit-retail-prices-' + dateStamp + '.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function toggleView() {
            const rich = document.getElementById('richView');
            const plain = document.getElementById('plainView');
            const btn = document.getElementById('viewToggleBtn');
            if (plain.style.display === 'none') {
                plain.style.display = 'block';
                rich.style.display = 'none';
                btn.textContent = 'Switch to card view';
            } else {
                plain.style.display = 'none';
                rich.style.display = 'block';
                btn.textContent = 'Switch to plain text view';
            }
        }

        loadPrices();
    </script>
</body>
</html>
