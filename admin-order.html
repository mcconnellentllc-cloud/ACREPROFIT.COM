<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acre Profit Admin - Place Order for Customer">
    <title>Place Order for Customer - Acre Profit Admin</title>
    <link rel="icon" type="image/svg+xml" href="logo-icon.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar admin-nav">
        <div class="container">
            <a href="/" class="logo">
                <img src="logo.svg" alt="Acre Profit">
            </a>
            <div class="nav-center">
                <a href="/admin.html" class="nav-back">← Back to Dashboard</a>
                <span class="nav-title">Place Order for Customer</span>
            </div>
            <div class="nav-right">
                <a href="#" id="logoutBtn" class="btn btn-outline btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <main class="admin-customer-select-page">
        <div class="container">
            <div class="customer-select-hero">
                <h1>Select a Customer</h1>
                <p>Choose the customer you want to place an order for. You'll then use the same ordering experience they would.</p>
            </div>

            <!-- Search Box -->
            <div class="customer-search-box">
                <div class="search-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </div>
                <input type="text" id="customerSearchInput" placeholder="Search by name, email, or farm..." autofocus>
            </div>

            <!-- Customer Results -->
            <div class="customer-results" id="customerResults">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading customers...</p>
                </div>
            </div>

            <!-- Recent Customers Section -->
            <div class="recent-customers-section" id="recentCustomersSection" style="display: none;">
                <h3>Recent Customers</h3>
                <div class="recent-customers-grid" id="recentCustomersGrid">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom" style="border-top: none; padding-top: 0;">
                <p>&copy; 2026 AcreProfit.com. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        const API_URL = 'https://acreprofit-com.onrender.com';

        // Check auth
        const token = localStorage.getItem('token');
        const user = localStorage.getItem('user');

        if (!token || !user) {
            window.location.href = '/login.html';
        }

        const userData = JSON.parse(user);

        // Check if admin/distributor
        if (userData.role !== 'superadmin' && userData.role !== 'admin' && userData.role !== 'distributor') {
            window.location.href = '/dashboard.html';
        }

        // Logout handler
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        });

        // State
        let allCustomers = [];
        let recentCustomerIds = JSON.parse(localStorage.getItem('recentCustomers') || '[]');

        // Load customers
        async function loadCustomers() {
            try {
                const res = await fetch(`${API_URL}/api/admin/customers`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                allCustomers = await res.json();

                // Show all customers initially
                renderCustomerList(allCustomers.slice(0, 20));

                // Show recent customers
                showRecentCustomers();

            } catch (error) {
                console.error('Error loading customers:', error);
                document.getElementById('customerResults').innerHTML = `
                    <div class="error-state">
                        <p>Failed to load customers. Please try again.</p>
                        <button class="btn btn-primary" onclick="loadCustomers()">Retry</button>
                    </div>
                `;
            }
        }

        // Show recent customers
        function showRecentCustomers() {
            if (recentCustomerIds.length === 0) return;

            const recentCustomers = recentCustomerIds
                .map(id => allCustomers.find(c => c._id === id))
                .filter(c => c);

            if (recentCustomers.length === 0) return;

            const section = document.getElementById('recentCustomersSection');
            const grid = document.getElementById('recentCustomersGrid');

            grid.innerHTML = recentCustomers.slice(0, 4).map(c => `
                <div class="recent-customer-card" onclick="selectCustomer('${c._id}')">
                    <div class="recent-customer-avatar">${getInitials(c.name)}</div>
                    <div class="recent-customer-info">
                        <strong>${c.name}</strong>
                        <span>${c.farm || c.email}</span>
                    </div>
                </div>
            `).join('');

            section.style.display = 'block';
        }

        // Customer search
        const searchInput = document.getElementById('customerSearchInput');
        let searchTimeout;

        searchInput.addEventListener('input', function(e) {
            clearTimeout(searchTimeout);
            const term = e.target.value.toLowerCase().trim();

            searchTimeout = setTimeout(() => {
                if (term.length === 0) {
                    renderCustomerList(allCustomers.slice(0, 20));
                    return;
                }

                const filtered = allCustomers.filter(c =>
                    c.name.toLowerCase().includes(term) ||
                    c.email.toLowerCase().includes(term) ||
                    (c.farm && c.farm.toLowerCase().includes(term)) ||
                    (c.phone && c.phone.includes(term))
                );

                renderCustomerList(filtered);
            }, 150);
        });

        // Render customer list
        function renderCustomerList(customers) {
            const container = document.getElementById('customerResults');

            if (customers.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.35-4.35"></path>
                            </svg>
                        </div>
                        <p>No customers found</p>
                        <span>Try a different search term</span>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="customer-grid">
                    ${customers.map(c => `
                        <div class="customer-card" onclick="selectCustomer('${c._id}')">
                            <div class="customer-avatar">${getInitials(c.name)}</div>
                            <div class="customer-info">
                                <h4>${c.name}</h4>
                                <p class="customer-farm">${c.farm || 'No farm name'}</p>
                                <p class="customer-contact">${c.email}</p>
                                ${c.phone ? `<p class="customer-phone">${c.phone}</p>` : ''}
                            </div>
                            <div class="customer-action">
                                <span class="select-arrow">→</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
                ${customers.length >= 20 ? `<p class="results-note">Showing first 20 results. Search to find more.</p>` : ''}
            `;
        }

        // Get initials from name
        function getInitials(name) {
            return name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
        }

        // Select customer and redirect to order page
        function selectCustomer(customerId) {
            const customer = allCustomers.find(c => c._id === customerId);
            if (!customer) return;

            // Save to recent customers
            recentCustomerIds = recentCustomerIds.filter(id => id !== customerId);
            recentCustomerIds.unshift(customerId);
            recentCustomerIds = recentCustomerIds.slice(0, 10);
            localStorage.setItem('recentCustomers', JSON.stringify(recentCustomerIds));

            // Set the acting as customer in session storage
            sessionStorage.setItem('actingAsCustomer', JSON.stringify({
                _id: customer._id,
                name: customer.name,
                email: customer.email,
                farm: customer.farm,
                phone: customer.phone
            }));

            // Redirect to the customer-facing order page
            // The order.html page will detect actingAsCustomer and show the banner
            window.location.href = '/order.html';
        }

        // Check for customer param in URL (for direct links)
        function checkUrlCustomer() {
            const params = new URLSearchParams(window.location.search);
            const customerId = params.get('customer');

            if (customerId && allCustomers.length > 0) {
                selectCustomer(customerId);
            }
        }

        // Initialize
        loadCustomers().then(() => {
            checkUrlCustomer();
        });
    </script>

    <style>
        .admin-customer-select-page {
            padding: 120px 0 60px;
            background: var(--secondary);
            min-height: 100vh;
        }

        .customer-select-hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .customer-select-hero h1 {
            font-size: 2.5rem;
            margin-bottom: 12px;
            color: var(--primary);
        }

        .customer-select-hero p {
            color: var(--text-muted);
            font-size: 1.125rem;
            max-width: 500px;
            margin: 0 auto;
        }

        .customer-search-box {
            position: relative;
            max-width: 600px;
            margin: 0 auto 40px;
        }

        .customer-search-box .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .customer-search-box input {
            width: 100%;
            padding: 20px 20px 20px 56px;
            border: 2px solid var(--border);
            border-radius: var(--radius-lg);
            font-size: 1.125rem;
            background: var(--white);
            box-shadow: var(--shadow-lg);
            transition: all 0.2s;
        }

        .customer-search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: var(--shadow-lg), 0 0 0 4px rgba(45, 90, 39, 0.1);
        }

        .customer-results {
            max-width: 900px;
            margin: 0 auto;
        }

        .loading-state,
        .empty-state,
        .error-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state .empty-icon {
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .empty-state p {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .empty-state span {
            color: var(--text-muted);
        }

        .customer-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .customer-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px 24px;
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .customer-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .customer-avatar {
            width: 56px;
            height: 56px;
            background: var(--primary);
            color: var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.25rem;
            flex-shrink: 0;
        }

        .customer-info {
            flex: 1;
            min-width: 0;
        }

        .customer-info h4 {
            font-size: 1.125rem;
            margin: 0 0 4px;
        }

        .customer-farm {
            color: var(--text-muted);
            margin: 0 0 2px;
            font-size: 0.9rem;
        }

        .customer-contact,
        .customer-phone {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin: 0;
        }

        .customer-action {
            flex-shrink: 0;
        }

        .select-arrow {
            font-size: 1.5rem;
            color: var(--primary);
            opacity: 0;
            transition: all 0.2s;
        }

        .customer-card:hover .select-arrow {
            opacity: 1;
            transform: translateX(4px);
        }

        .results-note {
            text-align: center;
            color: var(--text-muted);
            margin-top: 16px;
            font-size: 0.875rem;
        }

        /* Recent Customers */
        .recent-customers-section {
            max-width: 900px;
            margin: 0 auto 40px;
        }

        .recent-customers-section h3 {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .recent-customers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .recent-customer-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .recent-customer-card:hover {
            border-color: var(--primary);
        }

        .recent-customer-avatar {
            width: 40px;
            height: 40px;
            background: var(--primary);
            color: var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.875rem;
            flex-shrink: 0;
        }

        .recent-customer-info {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        .recent-customer-info strong {
            display: block;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recent-customer-info span {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Nav styling */
        .nav-center {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-back {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
        }

        .nav-back:hover {
            color: var(--primary);
        }

        .nav-title {
            font-weight: 600;
            color: var(--dark);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .customer-select-hero h1 {
                font-size: 1.75rem;
            }

            .customer-search-box input {
                font-size: 1rem;
                padding: 16px 16px 16px 48px;
            }

            .customer-card {
                padding: 16px;
            }

            .customer-avatar {
                width: 48px;
                height: 48px;
                font-size: 1rem;
            }

            .recent-customers-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</body>
</html>
