<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Change your Acre Profit password">
    <title>Change Password - Acre Profit</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2d5a27">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Acre Profit">
    <link rel="apple-touch-icon" href="/icon-192.svg">
    <link rel="manifest" href="/manifest.json">

    <link rel="icon" type="image/svg+xml" href="logo-icon.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="auth-split">
        <!-- Left side - Farm image -->
        <div class="auth-image">
            <div class="auth-image-content">
                <a href="/" class="auth-logo">
                    <img src="logo.svg" alt="Acre Profit">
                </a>
                <div class="auth-tagline">
                    <h2>Farmers Helping Farmers</h2>
                    <p>One quick step to secure your account.</p>
                </div>
            </div>
        </div>

        <!-- Right side - Change password form -->
        <div class="auth-form-side">
            <div class="auth-form-wrapper">
                <div class="auth-header">
                    <h1>Change Your Password</h1>
                    <p id="subheading">Your temporary password needs to be replaced with one only you know.</p>
                </div>

                <form id="changePasswordForm" class="auth-form">
                    <div class="form-group">
                        <label for="currentPassword">Current Password</label>
                        <input type="password" id="currentPassword" name="currentPassword" required autocomplete="current-password" placeholder="Your temporary password">
                    </div>

                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" name="newPassword" required autocomplete="new-password" placeholder="At least 8 characters" minlength="8">
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm New Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password" placeholder="Re-enter your new password">
                    </div>

                    <div id="errorMessage" class="error-message" style="display: none;"></div>
                    <div id="successMessage" class="success-message" style="display: none;"></div>

                    <button type="submit" class="btn btn-accent btn-lg btn-block" id="submitBtn">
                        Change Password
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.hostname === 'localhost'
            ? 'http://localhost:3000'
            : 'https://acreprofit-com.onrender.com';

        const token = localStorage.getItem('token');
        const userJson = localStorage.getItem('user');
        if (!token || !userJson) {
            window.location.href = '/login.html';
        }

        function redirectByRole(role) {
            if (role === 'supplier') {
                window.location.href = '/supplier-dashboard.html';
            } else if (role === 'superadmin' || role === 'admin' || role === 'distributor') {
                window.location.href = '/admin.html';
            } else {
                window.location.href = '/dashboard.html';
            }
        }

        document.getElementById('changePasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');

            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            if (newPassword !== confirmPassword) {
                errorDiv.textContent = 'New password and confirmation do not match.';
                errorDiv.style.display = 'block';
                return;
            }
            if (newPassword.length < 8) {
                errorDiv.textContent = 'New password must be at least 8 characters.';
                errorDiv.style.display = 'block';
                return;
            }
            if (newPassword === currentPassword) {
                errorDiv.textContent = 'New password must be different from your current password.';
                errorDiv.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Changing...';

            try {
                const response = await fetch(`${API_URL}/api/auth/change-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ currentPassword, newPassword })
                });
                const result = await response.json();

                if (!response.ok) {
                    errorDiv.textContent = result.error || 'Password change failed.';
                    errorDiv.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Change Password';
                    return;
                }

                // Success: replace the token, clear the must-change flag, redirect
                localStorage.setItem('token', result.token);
                localStorage.removeItem('passwordChangeRequired');

                successDiv.textContent = 'Password changed. Redirecting...';
                successDiv.style.display = 'block';

                const user = JSON.parse(userJson);
                setTimeout(() => redirectByRole(user.role), 1200);
            } catch (err) {
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Change Password';
            }
        });
    </script>
</body>
</html>
