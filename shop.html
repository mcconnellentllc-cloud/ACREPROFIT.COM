<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Shop bulk agricultural chemicals - herbicides, insecticides, fungicides, and more at wholesale prices">
    <title>Shop Products - AcreProfit</title>

    <meta name="theme-color" content="#16a34a">
    <link rel="icon" type="image/svg+xml" href="logo-icon.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-wrapper">
        <!-- Header -->
        <header class="header">
            <div class="header-inner">
                <a href="index.html" class="logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                    <span>AcreProfit</span>
                </a>

                <nav class="nav" id="main-nav">
                    <a href="shop.html" class="nav-link active">Shop Products</a>
                    <a href="calculator.html" class="nav-link">Calculator</a>
                    <a href="cart.html" class="nav-link">Cart (<span id="cart-count">0</span>)</a>
                </nav>

                <div class="nav-actions">
                    <a href="dashboard.html" class="btn btn-secondary" id="dashboard-btn">Dashboard</a>
                </div>

                <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container">
                <div class="dashboard-header">
                    <div>
                        <h1>Shop Products</h1>
                        <p class="text-muted">Browse our selection of bulk agricultural chemicals</p>
                    </div>
                </div>

                <!-- Search & Filters -->
                <div class="card mb-xl">
                    <div class="card-body">
                        <div class="flex gap-md flex-wrap">
                            <div class="form-group" style="flex: 1; min-width: 200px; margin: 0;">
                                <input
                                    type="text"
                                    id="search"
                                    class="form-input"
                                    placeholder="Search products..."
                                >
                            </div>
                            <div class="form-group" style="min-width: 150px; margin: 0;">
                                <select id="category-filter" class="form-select">
                                    <option value="">All Categories</option>
                                    <option value="herbicide">Herbicides</option>
                                    <option value="insecticide">Insecticides</option>
                                    <option value="fungicide">Fungicides</option>
                                    <option value="adjuvant">Adjuvants</option>
                                    <option value="fertilizer">Fertilizers</option>
                                    <option value="seed-treatment">Seed Treatments</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="form-group" style="min-width: 150px; margin: 0;">
                                <select id="sort-filter" class="form-select">
                                    <option value="name">Sort by Name</option>
                                    <option value="price-low">Price: Low to High</option>
                                    <option value="price-high">Price: High to Low</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Category Filters -->
                <div class="filters" id="category-buttons">
                    <button class="filter-btn active" data-category="">All Products</button>
                    <button class="filter-btn" data-category="herbicide">Herbicides</button>
                    <button class="filter-btn" data-category="insecticide">Insecticides</button>
                    <button class="filter-btn" data-category="fungicide">Fungicides</button>
                    <button class="filter-btn" data-category="adjuvant">Adjuvants</button>
                    <button class="filter-btn" data-category="fertilizer">Fertilizers</button>
                </div>

                <!-- Products Grid -->
                <div class="products-grid" id="products-grid">
                    <div class="product-card skeleton" style="height: 350px;"></div>
                    <div class="product-card skeleton" style="height: 350px;"></div>
                    <div class="product-card skeleton" style="height: 350px;"></div>
                    <div class="product-card skeleton" style="height: 350px;"></div>
                </div>

                <!-- Empty State -->
                <div class="empty-state hidden" id="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <h3>No products found</h3>
                    <p>Try adjusting your search or filter criteria</p>
                    <button class="btn btn-primary" onclick="resetFilters()">Clear Filters</button>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="container">
                <div class="footer-bottom" style="border-top: none; padding-top: 0;">
                    <p>&copy; 2024 AcreProfit. All rights reserved.</p>
                </div>
            </div>
        </footer>
    </div>

    <script>
        // API Configuration
        const API_URL = window.location.hostname === 'localhost'
            ? 'http://localhost:3001/api'
            : '/api';

        // Check auth status
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || 'null');

        if (!token) {
            document.getElementById('dashboard-btn').textContent = 'Sign In';
            document.getElementById('dashboard-btn').href = 'login.html';
        }

        // Cart management
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        updateCartCount();

        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cart-count').textContent = count;
        }

        // Mobile menu
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            document.getElementById('main-nav').classList.toggle('open');
        });

        // Products state
        let allProducts = [];
        let filteredProducts = [];

        // Load products
        async function loadProducts() {
            try {
                const response = await fetch(`${API_URL}/products`);
                const data = await response.json();

                if (data.success) {
                    allProducts = data.data.products;
                    applyFilters();
                } else {
                    showEmpty();
                }
            } catch (error) {
                console.error('Error loading products:', error);
                showEmpty();
            }
        }

        // Apply filters
        function applyFilters() {
            const search = document.getElementById('search').value.toLowerCase();
            const category = document.getElementById('category-filter').value;
            const sort = document.getElementById('sort-filter').value;

            filteredProducts = allProducts.filter(product => {
                const matchesSearch = !search ||
                    product.name.toLowerCase().includes(search) ||
                    product.description?.toLowerCase().includes(search) ||
                    product.activeIngredient?.toLowerCase().includes(search);

                const matchesCategory = !category || product.category === category;

                return matchesSearch && matchesCategory;
            });

            // Sort
            filteredProducts.sort((a, b) => {
                switch (sort) {
                    case 'price-low':
                        return (a.packageSizes[0]?.price || 0) - (b.packageSizes[0]?.price || 0);
                    case 'price-high':
                        return (b.packageSizes[0]?.price || 0) - (a.packageSizes[0]?.price || 0);
                    default:
                        return a.name.localeCompare(b.name);
                }
            });

            renderProducts();
        }

        // Render products
        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const empty = document.getElementById('empty-state');

            if (filteredProducts.length === 0) {
                grid.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }

            grid.classList.remove('hidden');
            empty.classList.add('hidden');

            grid.innerHTML = filteredProducts.map(product => {
                const lowestPrice = product.packageSizes.length > 0
                    ? Math.min(...product.packageSizes.map(ps => ps.price))
                    : null;

                const inStock = product.packageSizes.some(ps => ps.inventory > 0);

                return `
                    <a href="product.html?id=${product._id}" class="product-card">
                        <div class="product-card-image">
                            ${product.imageUrl
                                ? `<img src="${product.imageUrl}" alt="${product.name}">`
                                : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                                    <circle cx="8.5" cy="8.5" r="1.5"/>
                                    <path d="M21 15l-5-5L5 21"/>
                                </svg>`
                            }
                        </div>
                        <div class="product-card-body">
                            <span class="product-card-category">${product.category}</span>
                            <h3 class="product-card-title">${product.name}</h3>
                            ${product.activeIngredient ? `<p class="text-sm text-muted" style="margin: 0 0 var(--space-sm);">${product.activeIngredient}</p>` : ''}
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <span class="product-card-price">
                                    ${lowestPrice
                                        ? `From $${lowestPrice.toFixed(2)}`
                                        : 'Contact for pricing'
                                    }
                                </span>
                                ${inStock
                                    ? '<span class="badge badge-success">In Stock</span>'
                                    : '<span class="badge badge-error">Out of Stock</span>'
                                }
                            </div>
                        </div>
                    </a>
                `;
            }).join('');
        }

        function showEmpty() {
            document.getElementById('products-grid').classList.add('hidden');
            document.getElementById('empty-state').classList.remove('hidden');
        }

        function resetFilters() {
            document.getElementById('search').value = '';
            document.getElementById('category-filter').value = '';
            document.getElementById('sort-filter').value = 'name';

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.category === '');
            });

            applyFilters();
        }

        // Event listeners
        document.getElementById('search').addEventListener('input', applyFilters);
        document.getElementById('category-filter').addEventListener('change', (e) => {
            // Sync with buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.category === e.target.value);
            });
            applyFilters();
        });
        document.getElementById('sort-filter').addEventListener('change', applyFilters);

        // Category buttons
        document.getElementById('category-buttons').addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                document.getElementById('category-filter').value = e.target.dataset.category;
                applyFilters();
            }
        });

        // Check for category in URL
        const urlParams = new URLSearchParams(window.location.search);
        const categoryParam = urlParams.get('category');
        if (categoryParam) {
            document.getElementById('category-filter').value = categoryParam;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.category === categoryParam);
            });
        }

        // Load products on page load
        loadProducts();
    </script>
</body>
</html>
