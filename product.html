<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View product details and pricing - AcreProfit">
    <title>Product - AcreProfit</title>

    <meta name="theme-color" content="#16a34a">
    <link rel="icon" type="image/svg+xml" href="logo-icon.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-wrapper">
        <!-- Header -->
        <header class="header">
            <div class="header-inner">
                <a href="index.html" class="logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                    <span>AcreProfit</span>
                </a>

                <nav class="nav" id="main-nav">
                    <a href="shop.html" class="nav-link">Shop Products</a>
                    <a href="calculator.html" class="nav-link">Calculator</a>
                    <a href="cart.html" class="nav-link">Cart (<span id="cart-count">0</span>)</a>
                </nav>

                <div class="nav-actions">
                    <a href="dashboard.html" class="btn btn-secondary" id="dashboard-btn">Dashboard</a>
                </div>

                <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"/>
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container">
                <!-- Breadcrumb -->
                <nav style="margin-bottom: var(--space-lg);">
                    <a href="shop.html" class="text-muted">&larr; Back to Shop</a>
                </nav>

                <div id="product-content">
                    <!-- Loading skeleton -->
                    <div class="grid grid-2" style="gap: var(--space-2xl);">
                        <div class="skeleton" style="height: 400px; border-radius: var(--radius-lg);"></div>
                        <div>
                            <div class="skeleton" style="height: 32px; width: 60%; margin-bottom: var(--space-md);"></div>
                            <div class="skeleton" style="height: 24px; width: 40%; margin-bottom: var(--space-lg);"></div>
                            <div class="skeleton" style="height: 100px; margin-bottom: var(--space-lg);"></div>
                            <div class="skeleton" style="height: 200px;"></div>
                        </div>
                    </div>
                </div>

                <!-- Alert -->
                <div id="alert-container" style="position: fixed; top: 100px; right: 20px; z-index: 1000;"></div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="container">
                <div class="footer-bottom" style="border-top: none; padding-top: 0;">
                    <p>&copy; 2024 AcreProfit. All rights reserved.</p>
                </div>
            </div>
        </footer>
    </div>

    <script>
        // API Configuration
        const API_URL = window.location.hostname === 'localhost'
            ? 'http://localhost:3001/api'
            : '/api';

        // Check auth status
        const token = localStorage.getItem('token');
        if (!token) {
            document.getElementById('dashboard-btn').textContent = 'Sign In';
            document.getElementById('dashboard-btn').href = 'login.html';
        }

        // Cart management
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        updateCartCount();

        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cart-count').textContent = count;
        }

        function addToCart(productId, productName, packageSizeIndex, volume, unit, price, quantity) {
            const existingIndex = cart.findIndex(
                item => item.productId === productId && item.packageSizeIndex === packageSizeIndex
            );

            if (existingIndex >= 0) {
                cart[existingIndex].quantity += quantity;
            } else {
                cart.push({
                    productId,
                    productName,
                    packageSizeIndex,
                    volume,
                    unit,
                    price,
                    quantity
                });
            }

            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            showAlert('Added to cart!', 'success');
        }

        function showAlert(message, type = 'success') {
            const container = document.getElementById('alert-container');
            container.innerHTML = `
                <div class="alert alert-${type}" style="box-shadow: var(--shadow-lg);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        ${type === 'success'
                            ? '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>'
                            : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'}
                    </svg>
                    <span>${message}</span>
                </div>
            `;
            setTimeout(() => container.innerHTML = '', 3000);
        }

        // Mobile menu
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            document.getElementById('main-nav').classList.toggle('open');
        });

        // Get product ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        if (!productId) {
            window.location.href = 'shop.html';
        }

        // Load product
        async function loadProduct() {
            try {
                const response = await fetch(`${API_URL}/products/${productId}`);
                const data = await response.json();

                if (data.success) {
                    renderProduct(data.data.product);
                } else {
                    showError('Product not found');
                }
            } catch (error) {
                console.error('Error loading product:', error);
                showError('Error loading product');
            }
        }

        function renderProduct(product) {
            document.title = `${product.name} - AcreProfit`;

            const content = document.getElementById('product-content');
            content.innerHTML = `
                <div class="grid grid-2" style="gap: var(--space-2xl);">
                    <!-- Product Image -->
                    <div class="card" style="overflow: hidden;">
                        <div style="height: 400px; background: var(--gray-100); display: flex; align-items: center; justify-content: center;">
                            ${product.imageUrl
                                ? `<img src="${product.imageUrl}" alt="${product.name}" style="width: 100%; height: 100%; object-fit: contain;">`
                                : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="width: 128px; height: 128px; color: var(--gray-400);">
                                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                                    <circle cx="8.5" cy="8.5" r="1.5"/>
                                    <path d="M21 15l-5-5L5 21"/>
                                </svg>`
                            }
                        </div>
                    </div>

                    <!-- Product Details -->
                    <div>
                        <span class="badge badge-gray mb-sm">${product.category}</span>
                        <h1 style="margin-bottom: var(--space-sm);">${product.name}</h1>

                        ${product.activeIngredient
                            ? `<p class="text-muted" style="margin-bottom: var(--space-lg);">Active Ingredient: <strong>${product.activeIngredient}</strong></p>`
                            : ''}

                        ${product.description
                            ? `<p style="margin-bottom: var(--space-lg);">${product.description}</p>`
                            : ''}

                        ${product.applicationRate
                            ? `<div class="card" style="margin-bottom: var(--space-lg);">
                                <div class="card-body">
                                    <h4 style="margin-bottom: var(--space-sm);">Application Rate</h4>
                                    <p class="text-lg" style="margin: 0;">
                                        ${product.applicationRate.min}${product.applicationRate.max ? ` - ${product.applicationRate.max}` : ''}
                                        ${product.applicationRate.unit}
                                    </p>
                                </div>
                            </div>`
                            : ''}

                        <!-- Package Sizes -->
                        <div class="card">
                            <div class="card-header">
                                <h3>Select Package Size</h3>
                            </div>
                            <div class="card-body">
                                ${product.packageSizes.length > 0
                                    ? product.packageSizes.map((ps, index) => `
                                        <div class="package-option" data-index="${index}" style="
                                            display: flex;
                                            justify-content: space-between;
                                            align-items: center;
                                            padding: var(--space-md);
                                            border: 2px solid var(--gray-200);
                                            border-radius: var(--radius-md);
                                            margin-bottom: var(--space-sm);
                                            cursor: pointer;
                                            transition: all var(--transition-fast);
                                            ${ps.inventory < 1 ? 'opacity: 0.5; cursor: not-allowed;' : ''}
                                        ">
                                            <div>
                                                <strong>${ps.volume} ${ps.unit}</strong>
                                                ${ps.sku ? `<span class="text-sm text-muted"> (${ps.sku})</span>` : ''}
                                                <p class="text-sm text-muted" style="margin: 0;">
                                                    ${ps.inventory > 0 ? `${ps.inventory} in stock` : 'Out of stock'}
                                                </p>
                                            </div>
                                            <div style="text-align: right;">
                                                <span class="text-xl font-bold" style="color: var(--primary);">$${ps.price.toFixed(2)}</span>
                                            </div>
                                        </div>
                                    `).join('')
                                    : '<p class="text-muted">No packages available</p>'
                                }
                            </div>
                            <div class="card-footer" id="add-to-cart-section" style="display: none;">
                                <div style="display: flex; gap: var(--space-md); align-items: center;">
                                    <div class="quantity-control">
                                        <button type="button" onclick="decrementQty()">-</button>
                                        <span id="quantity">1</span>
                                        <button type="button" onclick="incrementQty()">+</button>
                                    </div>
                                    <button class="btn btn-primary btn-lg" style="flex: 1;" onclick="handleAddToCart()">
                                        Add to Cart - $<span id="total-price">0.00</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Additional Info -->
                        <div style="margin-top: var(--space-lg); display: flex; gap: var(--space-lg);">
                            ${product.safetyDataSheet
                                ? `<a href="${product.safetyDataSheet}" target="_blank" class="btn btn-secondary">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 18px; height: 18px;">
                                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                        <polyline points="14 2 14 8 20 8"/>
                                    </svg>
                                    Safety Data Sheet
                                </a>`
                                : ''}
                            ${product.label
                                ? `<a href="${product.label}" target="_blank" class="btn btn-secondary">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 18px; height: 18px;">
                                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                        <polyline points="14 2 14 8 20 8"/>
                                    </svg>
                                    Product Label
                                </a>`
                                : ''}
                        </div>
                    </div>
                </div>
            `;

            // Store product data for cart
            window.currentProduct = product;

            // Package selection
            document.querySelectorAll('.package-option').forEach(option => {
                option.addEventListener('click', function() {
                    const index = parseInt(this.dataset.index);
                    const ps = product.packageSizes[index];

                    if (ps.inventory < 1) return;

                    document.querySelectorAll('.package-option').forEach(o => {
                        o.style.borderColor = 'var(--gray-200)';
                        o.style.background = 'transparent';
                    });

                    this.style.borderColor = 'var(--primary)';
                    this.style.background = 'rgba(22, 163, 74, 0.05)';

                    window.selectedPackageIndex = index;
                    window.selectedPackage = ps;
                    document.getElementById('quantity').textContent = '1';
                    window.selectedQuantity = 1;
                    updateTotalPrice();

                    document.getElementById('add-to-cart-section').style.display = 'block';
                });
            });
        }

        function updateTotalPrice() {
            if (window.selectedPackage) {
                const total = window.selectedPackage.price * window.selectedQuantity;
                document.getElementById('total-price').textContent = total.toFixed(2);
            }
        }

        function incrementQty() {
            if (!window.selectedPackage) return;
            if (window.selectedQuantity < window.selectedPackage.inventory) {
                window.selectedQuantity++;
                document.getElementById('quantity').textContent = window.selectedQuantity;
                updateTotalPrice();
            }
        }

        function decrementQty() {
            if (window.selectedQuantity > 1) {
                window.selectedQuantity--;
                document.getElementById('quantity').textContent = window.selectedQuantity;
                updateTotalPrice();
            }
        }

        function handleAddToCart() {
            if (!window.currentProduct || !window.selectedPackage) return;

            addToCart(
                window.currentProduct._id,
                window.currentProduct.name,
                window.selectedPackageIndex,
                window.selectedPackage.volume,
                window.selectedPackage.unit,
                window.selectedPackage.price,
                window.selectedQuantity
            );
        }

        function showError(message) {
            document.getElementById('product-content').innerHTML = `
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    <h3>${message}</h3>
                    <p>The product you're looking for could not be found.</p>
                    <a href="shop.html" class="btn btn-primary">Back to Shop</a>
                </div>
            `;
        }

        // Initialize
        window.selectedQuantity = 1;
        loadProduct();
    </script>
</body>
</html>
