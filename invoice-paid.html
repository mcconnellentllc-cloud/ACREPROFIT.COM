<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Received - Acre Profit</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f5f0 0%, #e8f5e9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1a1a1a;
        }
        .card {
            max-width: 520px;
            background: #ffffff;
            border-radius: 16px;
            padding: 48px 40px;
            box-shadow: 0 10px 40px rgba(45, 90, 39, 0.15);
            text-align: center;
        }
        .check {
            width: 88px;
            height: 88px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: #d1fae5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #065f46;
            font-size: 48px;
            font-weight: 700;
        }
        h1 {
            color: #2d5a27;
            font-size: 30px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        p.lead {
            color: #444;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        p.invoice {
            color: #666;
            font-size: 14px;
            margin: 20px 0 28px;
            padding: 12px 16px;
            background: #f5f5f0;
            border-radius: 8px;
            display: inline-block;
        }
        .actions {
            margin-top: 12px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.1s ease;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn-primary { background: #2d5a27; color: #ffffff; }
        .btn-secondary {
            background: #ffffff;
            color: #2d5a27;
            border: 2px solid #2d5a27;
        }
        .footer {
            margin-top: 32px;
            color: #888;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="check">&#10003;</div>
        <h1>Payment Received</h1>
        <p class="lead">Thank you! Your invoice has been marked paid.</p>
        <p class="lead">A receipt is on its way to your email.</p>
        <p class="invoice" id="invoiceLabel">Invoice</p>
        <div class="actions">
            <a href="/my-orders.html" class="btn btn-primary">View My Invoices</a>
            <a href="/" class="btn btn-secondary">Back to Home</a>
        </div>
        <p class="footer">
            Questions? Reply to the receipt email or contact us at
            <a href="mailto:contact@acreprofit.com" style="color: #2d5a27;">contact@acreprofit.com</a>.
        </p>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const invoice = params.get('invoice');
        const status = params.get('status');
        const label = document.getElementById('invoiceLabel');
        if (invoice) {
            label.textContent = status === 'already-paid'
                ? 'Invoice ' + invoice + ' was already paid'
                : 'Invoice ' + invoice;
        } else {
            label.style.display = 'none';
        }
    </script>
</body>
</html>
