# Pioneer Analytics - Render Deployment Configuration
services:
  - type: web
    name: pioneer-analytics
    env: node
    region: oregon
    plan: free
    rootDir: internal-pioneer/server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_CODE
        sync: false
