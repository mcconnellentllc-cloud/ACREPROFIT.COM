<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acre Profit Merch Store - Earn $20 for every $2000 spent">
    <title>Merch Store - Acre Profit</title>
    <link rel="icon" type="image/svg+xml" href="logo-icon.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Admin Preview Mode Banner -->
    <div id="adminPreviewBanner" class="admin-preview-banner" style="display: none;">
        <div class="container" style="display: flex; align-items: center; justify-content: space-between;">
            <span>Admin Preview Mode - You're viewing the site as a customer</span>
            <button id="exitPreviewBtn" class="btn btn-sm" style="background: white; color: #2D5A27;">Back to Admin</button>
        </div>
    </div>
    <nav class="navbar">
        <div class="container">
            <a href="/dashboard.html" class="logo">
                <img src="logo.svg" alt="Acre Profit">
            </a>
            <div class="nav-center">
                <a href="/dashboard.html" class="nav-back">← Dashboard</a>
                <span class="nav-title">Merch Store</span>
            </div>
            <div class="nav-right">
                <a href="#" id="logoutBtn" class="btn btn-outline btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <main class="merch-page">
        <div class="container">
            <div class="merch-header">
                <div class="merch-intro">
                    <h1>Acre Profit Merch</h1>
                    <p>Quality farm workwear and gear.</p>
                </div>
            </div>

            <!-- Products loaded dynamically -->
            <div id="merchProducts"></div>

            <!-- Cart Sidebar -->
            <div class="cart-overlay" id="cartOverlay"></div>
            <div class="cart-sidebar" id="cartSidebar">
                <div class="cart-header">
                    <h3>Your Cart</h3>
                    <button class="cart-close" id="cartClose">&times;</button>
                </div>
                <div class="cart-items" id="cartItems">
                    <p class="cart-empty">Your cart is empty</p>
                </div>
                <div class="cart-footer">
                    <div class="cart-totals">
                        <div class="cart-row total-row">
                            <span>Total</span>
                            <span id="cartTotal">$0.00</span>
                        </div>
                    </div>
                    <button class="btn btn-primary btn-block" id="checkoutBtn" disabled>
                        Checkout
                    </button>
                    <p class="cart-note">Credit applied automatically at checkout</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom" style="border-top: none; padding-top: 0;">
                <p>&copy; 2026 AcreProfit.com. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        const API_URL = 'https://acreprofit-com.onrender.com';

        // Check auth
        const token = localStorage.getItem('token');
        const user = localStorage.getItem('user');

        if (!token || !user) {
            window.location.href = '/login.html';
        }

        const userData = JSON.parse(user);

        // Check for admin preview mode
        const isAdminPreview = localStorage.getItem('adminPreviewMode') === 'true';
        if (isAdminPreview && (userData.role === 'superadmin' || userData.role === 'admin')) {
            const banner = document.getElementById('adminPreviewBanner');
            if (banner) {
                banner.style.display = 'block';
            }
            document.getElementById('exitPreviewBtn')?.addEventListener('click', function() {
                localStorage.removeItem('adminPreviewMode');
                window.location.href = '/admin.html';
            });
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        });

        // Products with pricing (base cost + 10% markup + shipping included)
        // Base costs from Printify, markup 10%, shipping ~$5-8 built in
        const merchProducts = {
            outerwear: {
                title: 'Outerwear',
                items: [
                    { id: 'chore-coat', name: 'Work Jacket', desc: 'Heavy canvas duck jacket with embroidered logo', baseCost: 45, price: 58, sizes: ['S', 'M', 'L', 'XL', '2XL', '3XL'] },
                    { id: 'quarter-zip', name: '1/4 Zip Pullover', desc: 'Premium fleece quarter-zip', baseCost: 32, price: 42, sizes: ['S', 'M', 'L', 'XL', '2XL'] },
                    { id: 'full-zip-hoodie', name: 'Full Zip Hoodie', desc: 'Heavyweight fleece with embroidered logo', baseCost: 28, price: 38, sizes: ['S', 'M', 'L', 'XL', '2XL', '3XL'] },
                    { id: 'pullover-hoodie', name: 'Pullover Hoodie', desc: 'Classic pullover with front logo', baseCost: 25, price: 35, sizes: ['S', 'M', 'L', 'XL', '2XL', '3XL'] }
                ]
            },
            hats: {
                title: 'Hats',
                items: [
                    { id: 'trucker-green', name: 'Trucker Cap - Green', desc: 'Classic mesh back snapback', baseCost: 12, price: 22, sizes: ['One Size'] },
                    { id: 'trucker-black', name: 'Trucker Cap - Black', desc: 'Classic mesh back snapback', baseCost: 12, price: 22, sizes: ['One Size'] },
                    { id: 'trucker-camo', name: 'Trucker Cap - Camo', desc: 'Realtree camo mesh back', baseCost: 14, price: 24, sizes: ['One Size'] },
                    { id: 'fitted-black', name: 'Fitted Cap - Black', desc: 'Structured mid-profile fitted', baseCost: 15, price: 26, sizes: ['S/M', 'L/XL'] },
                    { id: 'beanie', name: 'Knit Beanie', desc: 'Warm ribbed cuff beanie with patch', baseCost: 10, price: 18, sizes: ['One Size'] }
                ]
            },
            tees: {
                title: 'T-Shirts',
                items: [
                    { id: 'classic-tee-green', name: 'Classic Logo Tee - Green', desc: 'Soft cotton with chest logo', baseCost: 12, price: 22, sizes: ['S', 'M', 'L', 'XL', '2XL', '3XL'] },
                    { id: 'classic-tee-black', name: 'Classic Logo Tee - Black', desc: 'Soft cotton with chest logo', baseCost: 12, price: 22, sizes: ['S', 'M', 'L', 'XL', '2XL', '3XL'] },
                    { id: 'farmers-tee', name: '"Farmers Helping Farmers" Tee', desc: 'Statement tee with back print', baseCost: 14, price: 25, sizes: ['S', 'M', 'L', 'XL', '2XL', '3XL'] }
                ]
            }
        };

        // Render products
        function renderProducts() {
            const container = document.getElementById('merchProducts');
            let html = '';

            for (const [category, data] of Object.entries(merchProducts)) {
                html += `
                    <section class="merch-section">
                        <h2>${data.title}</h2>
                        <div class="products-grid">
                            ${data.items.map(item => `
                                <div class="product-card" data-product-id="${item.id}">
                                    <div class="product-image">
                                        <div class="product-placeholder ${category}">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                                                <rect fill="#2D5A27" width="100" height="100" rx="4"/>
                                                <text x="50" y="42" font-family="Inter, sans-serif" font-weight="900" font-size="16" fill="white" text-anchor="middle">ACRE</text>
                                                <text x="50" y="60" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="white" text-anchor="middle">PROFIT</text>
                                            </svg>
                                        </div>
                                    </div>
                                    <div class="product-info">
                                        <h3>${item.name}</h3>
                                        <p class="product-desc">${item.desc}</p>
                                        <div class="product-sizes">
                                            ${item.sizes.map((size, i) => `
                                                <label class="size-option">
                                                    <input type="radio" name="size-${item.id}" value="${size}" ${i === 0 ? 'checked' : ''}>
                                                    <span>${size}</span>
                                                </label>
                                            `).join('')}
                                        </div>
                                        <div class="product-price">
                                            <span class="price">$${item.price.toFixed(2)}</span>
                                            <span class="credit-price">or ${item.price} credits</span>
                                        </div>
                                        <button class="btn btn-primary btn-block add-to-cart"
                                                data-product="${item.id}"
                                                data-name="${item.name}"
                                                data-price="${item.price}">
                                            Add to Cart
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                `;
            }

            html += `
                <div class="free-shipping-banner">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
                    <span>Free Shipping Included on All Orders</span>
                </div>
            `;

            container.innerHTML = html;
            attachCartListeners();
        }

        // Cart state
        let cart = [];

        // Cart functionality
        const cartOverlay = document.getElementById('cartOverlay');
        const cartSidebar = document.getElementById('cartSidebar');
        const cartClose = document.getElementById('cartClose');

        function openCart() {
            cartOverlay.classList.add('active');
            cartSidebar.classList.add('active');
        }

        function closeCart() {
            cartOverlay.classList.remove('active');
            cartSidebar.classList.remove('active');
        }

        cartOverlay.addEventListener('click', closeCart);
        cartClose.addEventListener('click', closeCart);

        function attachCartListeners() {
            document.querySelectorAll('.add-to-cart').forEach(btn => {
                btn.addEventListener('click', function() {
                    const productId = this.dataset.product;
                    const productName = this.dataset.name;
                    const price = parseFloat(this.dataset.price);
                    const card = this.closest('.product-card');
                    const selectedSize = card.querySelector(`input[name="size-${productId}"]:checked`)?.value || 'One Size';

                    const cartKey = `${productId}-${selectedSize}`;
                    const existing = cart.find(item => item.cartKey === cartKey);

                    if (existing) {
                        existing.quantity++;
                    } else {
                        cart.push({
                            cartKey,
                            product: productId,
                            name: productName,
                            size: selectedSize,
                            price,
                            quantity: 1
                        });
                    }

                    updateCart();
                    openCart();
                });
            });
        }

        function updateCart() {
            const cartItems = document.getElementById('cartItems');
            const cartTotal = document.getElementById('cartTotal');
            const checkoutBtn = document.getElementById('checkoutBtn');

            if (cart.length === 0) {
                cartItems.innerHTML = '<p class="cart-empty">Your cart is empty</p>';
                cartTotal.textContent = '$0.00';
                checkoutBtn.disabled = true;
                return;
            }

            let total = 0;
            cartItems.innerHTML = cart.map(item => {
                total += item.price * item.quantity;
                return `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <h4>${item.name}</h4>
                            <span class="cart-item-size">Size: ${item.size}</span>
                            <span class="cart-item-price">$${item.price.toFixed(2)}</span>
                        </div>
                        <div class="cart-item-qty">
                            <button class="qty-btn" onclick="updateQty('${item.cartKey}', -1)">-</button>
                            <span>${item.quantity}</span>
                            <button class="qty-btn" onclick="updateQty('${item.cartKey}', 1)">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            cartTotal.textContent = `$${total.toFixed(2)}`;
            checkoutBtn.disabled = false;
        }

        function updateQty(cartKey, delta) {
            const item = cart.find(i => i.cartKey === cartKey);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.cartKey !== cartKey);
                }
            }
            updateCart();
        }

        // Checkout - submits order to API which will forward to Printify
        document.getElementById('checkoutBtn').addEventListener('click', async function() {
            const btn = this;
            btn.disabled = true;
            btn.textContent = 'Processing...';

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            try {
                // Submit merch order to API
                const response = await fetch(`${API_URL}/api/merch-orders`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        items: cart.map(item => ({
                            productId: item.product,
                            name: item.name,
                            size: item.size,
                            quantity: item.quantity,
                            price: item.price
                        })),
                        total,
                        shippingAddress: userData.farm ? {
                            name: userData.name,
                            address: userData.farm.address || '',
                            city: userData.farm.county || '',
                            state: userData.farm.state,
                            zip: userData.farm.zip || ''
                        } : null
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Failed to place order');
                }

                // Success
                alert(`Order placed successfully! Total: $${total.toFixed(2)}. You'll receive shipping confirmation via email.`);

                cart = [];
                updateCart();
                closeCart();

            } catch (error) {
                alert('Error: ' + error.message);
            }

            btn.disabled = false;
            btn.textContent = 'Checkout';
        });

        // Initialize
        renderProducts();
    </script>

    <style>
        .merch-page {
            padding: 100px 0 60px;
            background: var(--secondary);
            min-height: 100vh;
        }

        .merch-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .merch-intro h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .merch-intro p {
            color: var(--text-light);
        }

        .credit-card {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--white);
            padding: 20px 28px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
        }

        .credit-icon {
            width: 56px;
            height: 56px;
            background: rgba(45, 90, 39, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
        }

        .credit-label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .credit-amount {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--primary);
        }

        .merch-progress {
            background: var(--white);
            padding: 20px 24px;
            border-radius: var(--radius-lg);
            margin-bottom: 40px;
            box-shadow: var(--shadow);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.875rem;
            color: var(--text-light);
        }

        .progress-bar {
            height: 12px;
            background: #e0e0d8;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #4a7c44);
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        .merch-section {
            margin-bottom: 48px;
        }

        .merch-section h2 {
            font-size: 1.5rem;
            margin-bottom: 24px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
        }

        .product-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-xl);
        }

        .product-image {
            aspect-ratio: 1;
            background: #f5f5f0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .product-placeholder {
            width: 80%;
            height: 80%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-placeholder svg {
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }

        .product-info {
            padding: 20px;
        }

        .product-info h3 {
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .product-desc {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .product-price {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 16px;
        }

        .price {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .credit-price {
            font-size: 0.75rem;
            color: var(--primary);
        }

        /* Cart Sidebar */
        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            z-index: 1000;
        }

        .cart-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            max-width: 100%;
            height: 100vh;
            background: var(--white);
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.15);
            transition: right 0.3s ease;
            z-index: 1001;
            display: flex;
            flex-direction: column;
        }

        .cart-sidebar.active {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }

        .cart-close {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: var(--text-muted);
            line-height: 1;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
        }

        .cart-empty {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }

        .cart-item h4 {
            font-size: 0.875rem;
            margin-bottom: 4px;
        }

        .cart-item-price {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            border: 1px solid var(--border);
            background: var(--white);
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }

        .qty-btn:hover {
            background: var(--secondary);
        }

        .cart-footer {
            padding: 20px 24px;
            border-top: 1px solid var(--border);
            background: var(--secondary);
        }

        .cart-totals {
            margin-bottom: 16px;
        }

        .cart-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
        }

        .credit-row {
            color: var(--primary);
        }

        .total-row {
            font-size: 1.25rem;
            font-weight: 700;
            border-top: 2px solid var(--border);
            margin-top: 8px;
            padding-top: 12px;
        }

        .cart-note {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 12px;
        }

        .cart-item-size {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .product-sizes {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .size-option {
            cursor: pointer;
        }

        .size-option input {
            display: none;
        }

        .size-option span {
            display: inline-block;
            padding: 6px 12px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.75rem;
            font-weight: 600;
            transition: var(--transition);
        }

        .size-option:hover span {
            border-color: var(--primary);
        }

        .size-option input:checked + span {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--white);
        }

        .free-shipping-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--primary);
            color: var(--white);
            padding: 16px 24px;
            border-radius: var(--radius-lg);
            margin-top: 40px;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .merch-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .products-grid {
                grid-template-columns: 1fr;
            }

            .cart-sidebar {
                width: 100%;
            }
        }
    </style>
</body>
</html>
