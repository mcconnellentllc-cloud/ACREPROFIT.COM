<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your AcreProfit password">
    <title>Forgot Password - AcreProfit</title>

    <meta name="theme-color" content="#16a34a">
    <link rel="icon" type="image/svg+xml" href="logo-icon.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
                <h1>AcreProfit</h1>
            </div>

            <div class="auth-title">
                <h2>Forgot Password?</h2>
                <p>Enter your email to receive a reset link</p>
            </div>

            <div id="alert-container"></div>

            <form id="forgot-form">
                <div class="form-group">
                    <label class="form-label required" for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-input"
                        placeholder="you@example.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">
                    <span class="btn-text">Send Reset Link</span>
                    <span class="btn-loading hidden">
                        <span class="spinner spinner-sm"></span>
                    </span>
                </button>
            </form>

            <div class="auth-footer">
                Remember your password? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script>
        // API Configuration
        const API_URL = window.location.hostname === 'localhost'
            ? 'http://localhost:3001/api'
            : '/api';

        // DOM Elements
        const form = document.getElementById('forgot-form');
        const submitBtn = document.getElementById('submit-btn');
        const alertContainer = document.getElementById('alert-container');

        // Show alert message
        function showAlert(message, type = 'error') {
            alertContainer.innerHTML = `
                <div class="alert alert-${type}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        ${type === 'error'
                            ? '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'
                            : '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>'}
                    </svg>
                    <span>${message}</span>
                </div>
            `;
        }

        // Set loading state
        function setLoading(loading) {
            submitBtn.disabled = loading;
            submitBtn.querySelector('.btn-text').classList.toggle('hidden', loading);
            submitBtn.querySelector('.btn-loading').classList.toggle('hidden', !loading);
        }

        // Handle form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();

            if (!email) {
                showAlert('Please enter your email address');
                return;
            }

            setLoading(true);
            alertContainer.innerHTML = '';

            try {
                const response = await fetch(`${API_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('If an account exists with this email, you will receive a password reset link shortly.', 'success');
                    form.reset();
                } else {
                    showAlert(data.message || 'Error processing request');
                }
            } catch (error) {
                console.error('Forgot password error:', error);
                showAlert('Unable to connect to server. Please try again.');
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
