<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your Acre Profit password">
    <title>Forgot Password - Acre Profit</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2d5a27">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Acre Profit">
    <link rel="apple-touch-icon" href="/icon-192.svg">
    <link rel="manifest" href="/manifest.json">

    <link rel="icon" type="image/svg+xml" href="logo-icon.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="auth-split">
        <!-- Left side - Farm image -->
        <div class="auth-image">
            <div class="auth-image-content">
                <a href="/" class="auth-logo">
                    <img src="logo.svg" alt="Acre Profit">
                </a>
                <div class="auth-tagline">
                    <h2>Farmers Helping Farmers</h2>
                    <p>Join our bulk buying co-op and save on the products you need most.</p>
                </div>
            </div>
        </div>

        <!-- Right side - Forgot password form -->
        <div class="auth-form-side">
            <div class="auth-form-wrapper">
                <div class="auth-header">
                    <h1>Reset Password</h1>
                    <p>Enter your email and we'll send you a link to reset your password.</p>
                </div>

                <form id="forgotPasswordForm" class="auth-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="you@yourfarm.com">
                    </div>

                    <div id="errorMessage" class="error-message" style="display: none;"></div>
                    <div id="successMessage" class="success-message" style="display: none;"></div>

                    <button type="submit" class="btn btn-accent btn-lg btn-block" id="submitBtn">
                        Send Reset Link
                    </button>

                    <p class="auth-switch">
                        Remember your password? <a href="/login.html">Sign in</a>
                    </p>
                </form>

                <div class="auth-footer">
                    <a href="/">Back to Home</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://acreprofit-com.onrender.com';
        const MAX_RETRIES = 3;
        const RETRY_DELAY_MS = 5000;

        document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            const email = document.getElementById('email').value;

            let lastError = null;

            for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
                try {
                    const response = await fetch(`${API_URL}/api/auth/forgot-password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(result.error || 'Failed to send reset link');
                    }

                    // Show success message
                    successDiv.textContent = 'If an account exists with this email, you will receive a password reset link shortly.';
                    successDiv.style.display = 'block';
                    submitBtn.textContent = 'Email Sent';
                    return;
                } catch (error) {
                    lastError = error;
                    const isNetworkError = error.message === 'Failed to fetch' || error.message.includes('Load failed');

                    if (!isNetworkError) break;

                    if (attempt < MAX_RETRIES) {
                        submitBtn.textContent = `Server waking up... retry ${attempt}/${MAX_RETRIES - 1}`;
                        await new Promise(r => setTimeout(r, RETRY_DELAY_MS));
                    }
                }
            }

            // All retries exhausted or non-network error
            const isNetworkError = lastError.message === 'Failed to fetch' || lastError.message.includes('Load failed');
            if (isNetworkError) {
                errorDiv.textContent = 'Server is currently unavailable. Please wait a moment and try again.';
            } else {
                // For security, show a generic success message even on error
                successDiv.textContent = 'If an account exists with this email, you will receive a password reset link shortly.';
                successDiv.style.display = 'block';
                submitBtn.textContent = 'Email Sent';
                return;
            }
            errorDiv.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Send Reset Link';
        });
    </script>

    <style>
        .auth-body {
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .auth-split {
            display: flex;
            min-height: 100vh;
        }

        .auth-image {
            flex: 1;
            background-image: url('https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?w=1200&q=80');
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: flex-end;
            padding: 48px;
        }

        .auth-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(30, 61, 26, 0.4) 0%, rgba(30, 61, 26, 0.85) 100%);
        }

        .auth-image-content {
            position: relative;
            z-index: 2;
            color: white;
        }

        .auth-logo img {
            height: 48px;
            filter: brightness(0) invert(1);
            margin-bottom: 32px;
        }

        .auth-tagline h2 {
            font-size: 2rem;
            margin-bottom: 12px;
            color: white;
        }

        .auth-tagline p {
            font-size: 1.125rem;
            color: rgba(255, 255, 255, 0.9);
            max-width: 400px;
        }

        .auth-form-side {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px;
            background: var(--white);
        }

        .auth-form-wrapper {
            width: 100%;
            max-width: 400px;
        }

        .auth-header {
            margin-bottom: 32px;
        }

        .auth-header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: var(--text);
        }

        .auth-header p {
            color: var(--text-light);
        }

        .auth-form .form-group {
            margin-bottom: 20px;
        }

        .auth-form label {
            display: block;
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 8px;
            color: var(--text);
        }

        .auth-form input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 1rem;
            font-family: inherit;
            transition: var(--transition);
            background: var(--white);
        }

        .auth-form input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(45, 90, 39, 0.1);
        }

        .error-message {
            background: #FEE2E2;
            color: #DC2626;
            padding: 12px 16px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            font-size: 0.875rem;
        }

        .success-message {
            background: #D1FAE5;
            color: #065F46;
            padding: 12px 16px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            font-size: 0.875rem;
        }

        .auth-switch {
            text-align: center;
            margin-top: 24px;
            color: var(--text-light);
        }

        .auth-switch a {
            color: var(--accent);
            font-weight: 600;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }

        .auth-footer {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .auth-footer a {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .auth-footer a:hover {
            color: var(--primary);
        }

        @media (max-width: 1024px) {
            .auth-image {
                display: none;
            }

            .auth-form-side {
                padding: 24px;
            }
        }

        @media (max-width: 480px) {
            .auth-form-wrapper {
                padding: 0;
            }

            .auth-header h1 {
                font-size: 1.75rem;
            }
        }
    </style>
</body>
</html>
